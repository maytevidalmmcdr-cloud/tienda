<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>PRODUCTOS - TIENDITA</title>
</head>

<body>

<nav class="navbar bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="tiendita.html">
            <img src="img/cecyto.jpg" width="30" height="24" alt="Logo">
            TIENDITA
        </a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- MENU LATERAL -->
        <div class="col-md-2 bg-primary text-white min-vh-100 p-3">

            <h4 class="text-center mt-3 mb-4">
                <i class="bi bi-list"></i> MENÚ
            </h4>

            <hr>

            <ul class="nav flex-column">

                <li class="nav-item mb-3">
                    <a href="productos.html" class="nav-link text-white">
                        <i class="bi bi-box-seam-fill"></i> Productos
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="categoria.html" class="nav-link text-white">
                        <i class="bi bi-tags-fill"></i> Categoría
                    </a>
                </li>

            </ul>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="col-md-10 p-4">

            <div class="container p-4 bg-info mt-3 card">

                <h1 class="text-center">PRODUCTOS</h1>

                <hr>

                <div class="d-flex justify-content-end">
                    <button class="btn btn-primary w-25"
                        onclick="abrirAgregarProducto()">
                        <i class="bi bi-person-plus"></i> Agregar
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover mt-3">

                        <thead>
                            <tr class="text-center table-primary">
                                <th>IMAGEN</th>
                                <th>PRODUCTO</th>
                                <th>PRECIO</th>
                                <th>CANTIDAD</th>
                                <th>CATEGORÍA</th>
                                <th>ACCIÓN</th>
                            </tr>
                        </thead>

                        <tbody id="tablaProductos"></tbody>

                        <!-- PIE DE TABLA SENCILLO -->
                        <tfoot id="totalesProductos" class="table-secondary fw-bold text-center"></tfoot>

                    </table>
                </div>

            </div>

        </div>

    </div>
</div>

<!-- MODAL AGREGAR PRODUCTO -->
<div class="modal fade" id="modalAgregarProducto" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">AGREGAR PRODUCTO</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form id="formAgregar">

                <div class="modal-body">

                    <label class="form-label">NOMBRE</label>
                    <input type="text" id="nombre" class="form-control" required>

                    <br>

                    <label class="form-label">PRECIO</label>
                    <input type="number" id="precio" class="form-control"
                        min="0" step="0.01" required>

                    <br>

                    <label class="form-label">CANTIDAD</label>
                    <input type="number" id="cantidad" class="form-control"
                        min="0" step="1" required>

                    <br>

                    <label class="form-label">CATEGORÍA</label>
                    <select id="categoria" class="form-select" required>
                        <option value="">Seleccionar categoría</option>
                    </select>

                    <br>

                    <label class="form-label">IMAGEN DEL PRODUCTO</label>
                    <input type="file" id="imagen" class="form-control"
                        accept="image/*">

                    <div class="mt-3 text-center">
                        <img id="vistaPrevia" src="" alt="Vista previa"
                            style="display:none; width:100px; height:100px; object-fit:cover;">
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-danger"
                        data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-floppy-fill"></i> Guardar
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<!-- MODAL EDITAR PRODUCTO -->
<div class="modal fade" id="modalEditarProducto" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">EDITAR PRODUCTO</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form id="formEditar">

                <div class="modal-body">

                    <input type="hidden" id="posicion">

                    <label class="form-label">NOMBRE</label>
                    <input type="text" id="nombree" class="form-control" required>

                    <br>

                    <label class="form-label">PRECIO</label>
                    <input type="number" id="precioe" class="form-control"
                        min="0" step="0.01" required>

                    <br>

                    <label class="form-label">CANTIDAD</label>
                    <input type="number" id="cantidade" class="form-control"
                        min="0" step="1" required>

                    <br>

                    <label class="form-label">CATEGORÍA</label>
                    <select id="categoriae" class="form-select" required>
                    </select>

                    <br>

                    <label class="form-label">CAMBIAR IMAGEN</label>
                    <input type="file" id="imagene" class="form-control"
                        accept="image/*">

                    <div class="mt-3 text-center">
                        <img id="vistaPreviaEditar" src="" alt="Imagen actual"
                            style="width:100px; height:100px; object-fit:cover;">
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-danger"
                        data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-floppy-fill"></i> Guardar cambios
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="productos.js"></script>

</body>
</html>
