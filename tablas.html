<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body>

    <a href="index.html">REGRESAR</a>

    <nav class="navbar bg-primary">
        <div class="container-fluid">
        </div>
    </nav>

    <div class="container p-4 bg-info mt-5 card">
        <h1 class="text-center">TABLAS DE MULTIPLICAR</h1>
        <hr>

        <div class="row">
            <div class="col">

                <table width="100%" class="table table-bordered bg-white shadow-sm">
                    <tr>
                        <td class="p-4 align-middle">
                            <h3>SELECCIONA LA TABLA</h3>

                            <input type="range" class="form-range" id="n1"
                            min="1" max="10" value="1" oninput="multiplicar()">

                            <span id="vn1">1</span>
                            <br><br>

                            <button onclick="reset()" class="btn btn-warning fw-bold text-white">
                                RESET
                            </button>
                        </td>

                        <td class="p-4 align-middle text-center bg-white">
                            <h1>RESULTADO</h1>

                            <div id="cargando" style="display:none;">
                                <img src="img/loading.gif" width="100">
                            </div>

                            <div id="resultado"></div>
                        </td>
                    </tr>
                </table>

            </div>
        </div>
    </div>

    <script src="tablas.js"></script>

</body>
</html>
