
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>PRACTICAS JAVASCRIPT</title>
</head>

<body>

    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="menu.html">
                <img src="img/cecyto.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                TIENDITA
            </a>
        </div>
    </nav>

    <div class="container p-4 bg-info mt-5 card">

        <h1 class="text-center">TIENDITA</h1>
        <hr>

        <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-primary w-25"
                onclick="document.getElementById('addProductos').showModal()">
                <i class="bi bi-person-plus"></i> Agregar
            </button>
        </div>

        <table class="table table-striped table-hover mt-3">

            <thead>
                <tr class="text-center table-primary">
                    <th>PRODUCTO</th>
                    <th>PRECIO</th>
                    <th>CANTIDAD</th>
                    <th>ACCIÓN</th>
                </tr>
            </thead>

            <tbody id="productos"></tbody>

        </table>

    </div>

    <!-- AGREGAR PRODUCTO -->

    <dialog class="rounded border-0 shadow p-4" id="addProductos">

        <div class="dialog-header">
            <h1 class="h3">AGREGAR PRODUCTO</h1>

            <button type="button" class="btn-close float-end"
                onclick="document.getElementById('addProductos').close()">
            </button>
        </div>

        <div class="dialog-body">

            <h3>NOMBRE</h3>
            <input type="text" id="nombre" class="form-control">

            <br>

            <h3>PRECIO</h3>
            <input type="number" id="precio" class="form-control" min="0" step="0.01">

            <br>

            <h3>CANTIDAD</h3>
            <input type="number" id="cantidad" class="form-control" min="0" step="1">

        </div>

        <div class="dialog-footer mt-3">

            <button type="button" class="btn btn-danger"
                onclick="document.getElementById('addProductos').close()">
                <i class="bi bi-x-circle"></i> Cancelar
            </button>

            <button type="button" class="btn btn-success" id="btnSave">
                <i class="bi bi-floppy-fill"></i> Guardar
            </button>

        </div>

    </dialog>

    <!-- EDITAR PRODUCTO -->

    <dialog class="rounded border-0 shadow p-4" id="editProducto">

        <div class="dialog-header">

            <h1 class="h3">EDITAR PRODUCTO</h1>

            <button type="button" class="btn-close float-end"
                onclick="document.getElementById('editProducto').close()">
            </button>

        </div>

        <div class="dialog-body">

            <input type="hidden" id="posicion">

            <h3>NOMBRE</h3>
            <input type="text" id="nombree" class="form-control">

            <br>

            <h3>PRECIO</h3>
            <input type="number" id="precioe" class="form-control" min="0" step="0.01">

            <br>

            <h3>CANTIDAD</h3>
            <input type="number" id="cantidade" class="form-control" min="0" step="1">

            <br>

        </div>

        <div class="dialog-footer">

            <button type="button" class="btn btn-danger"
                onclick="document.getElementById('editProducto').close()">
                <i class="bi bi-x-circle-fill"></i> Cancelar
            </button>

            <button type="button" class="btn btn-success" id="btnEdit">
                <i class="bi bi-box-arrow-down"></i> Guardar
            </button>

        </div>

    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="tiendita.js"></script>

</body>
</html>
