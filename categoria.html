
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>CATEGORÍAS - TIENDITA</title>
</head>

<body>

<nav class="navbar bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="tiendita.html">
            <img src="img/cecyto.jpg" width="30" height="24" alt="Logo">
            TIENDITA
        </a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- MENU LATERAL -->
        <div class="col-md-2 bg-primary text-white min-vh-100 p-3">

            <h4 class="text-center mt-3 mb-4">
                <i class="bi bi-list"></i> MENÚ
            </h4>

            <hr>

            <ul class="nav flex-column">

                <li class="nav-item mb-3">
                    <a href="productos.html" class="nav-link text-white">
                        <i class="bi bi-box-seam-fill"></i> Productos
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="categoria.html" class="nav-link text-white">
                        <i class="bi bi-tags-fill"></i> Categoría
                    </a>
                </li>

            </ul>
        </div>

        <!-- CONTENIDO -->
        <div class="col-md-10 p-4">

            <div class="container p-4 bg-info mt-3 card">

                <h1 class="text-center">CATEGORÍAS</h1>

                <hr>

                <div class="d-flex justify-content-end">
                    <button class="btn btn-primary w-25"
                        onclick="abrirAgregar()">
                        <i class="bi bi-plus-circle"></i> Agregar
                    </button>
                </div>

                <table class="table table-striped table-hover mt-3">

                    <thead>
                        <tr class="text-center table-primary">
                            <th>CATEGORÍA</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>

                    <tbody id="tablaCategorias"></tbody>

                </table>

            </div>

        </div>

    </div>
</div>

<!-- MODAL AGREGAR -->
<div class="modal fade" id="modalAgregar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">AGREGAR CATEGORÍA</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <label class="form-label">NOMBRE DE LA CATEGORÍA</label>
                <input type="text" id="nombreCategoria" class="form-control"
                    placeholder="Escribe la categoría">

            </div>

            <div class="modal-footer">

                <button class="btn btn-danger" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button class="btn btn-success" onclick="guardarCategoria()">
                    Guardar
                </button>

            </div>

        </div>
    </div>
</div>

<!-- MODAL EDITAR -->
<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">EDITAR CATEGORÍA</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="posicionCategoria">

                <label class="form-label">NOMBRE DE LA CATEGORÍA</label>
                <input type="text" id="nombreCategoriaEditar" class="form-control">

            </div>

            <div class="modal-footer">

                <button class="btn btn-danger" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button class="btn btn-success" onclick="actualizarCategoria()">
                    Guardar cambios
                </button>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="categoria.js"></script>

</body>
</html>
