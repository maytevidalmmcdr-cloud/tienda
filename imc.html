<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script type="module" src="js/bootstrap.bundle.min.js"></script>
       <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body>

    <a href="index.html">REGRESAR</a>


    <nav class="navbar bg-primary">
        <div class="container-fluid">
        </div>
    </nav>

    <div class="container p-4 bg-info mt-5 card">

        <h1 class="text-center">INDICE DE MASA CORPORAL</h1>
        <hr>

        <div class="row">
            <div class="col">

                <h5>IMC</h5>

                <table width="100%" class="table table-bordered bg-white shadow-sm">

                    <tr>
                        <td class="p-4 align-middle">

                            <h3>PESO (KG)</h3>

                            <input type="range" class="form-range" id="peso" min="1" max="150" value="50" oninput="calcular()">

                            <span id="vp">50</span><br><br>

                            <h3>ESTATURA (M)</h3>

                            <input type="range" class="form-range" id="estatura" min="1" max="2.20" step="0.01" value="1.50" oninput="calcular()">

                            <span id="ve">1.50</span><br><br>

                            <button onclick="reset()" class="btn btn-warning fw-bold text-white">RESET</button>

                        </td>

                        <td class="p-4 align-middle text-center bg-white">

                            <h1>RESULTADO</h1>
                            <table class="table table-bordered text-center mt-4">
    <tr><td id="imc1" class="text-white fw-bold" style="background:#29abe2">BAJO PESO (&lt;18.5)</td></tr>

    <tr><td id="imc2" class="text-white fw-bold" style="background:#8cc63f">NORMAL (18.5 - 24.9)</td></tr>

    <tr><td id="imc3" class="text-dark fw-bold" style="background:#f9d423">SOBREPESO (25 - 29.9)</td></tr>

    <tr><td id="imc4" class="text-white fw-bold" style="background:#f0a202">OBESIDAD I (30 - 34.9)</td></tr>

    <tr><td id="imc5" class="text-white fw-bold" style="background:#ff6f00">OBESIDAD II (35 - 39.9)</td></tr>

    <tr><td id="imc6" class="text-white fw-bold" style="background:#ff0000">OBESIDAD III (&ge;40)</td></tr>
</table>

                            <h2 id="resultado">0</h2>

                            <h3 id="clasificacion">---</h3>

                        </td>
                    </tr>

                </table>

            </div>
        </div>
    </div>

    <script src="imc.js"></script>

</body>
</html>
